[project]
name = "ai-news-frontend"
version = "0.1.0"
description = "Streamlit UI for AI News Newsletter Generator"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "streamlit>=1.38.0",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
