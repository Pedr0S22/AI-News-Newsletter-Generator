[project]
name = "ai-news-backend"
version = "0.1.0"
description = "FastAPI backend and multi-agent orchestration for AI News Newsletter Generator"
readme = "README.md"
requires-python = ">=3.11.6,<3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
