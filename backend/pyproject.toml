[project]
name = "ai-news-backend"
version = "0.1.0"
description = "FastAPI backend and multi-agent orchestration for AI News Newsletter Generator"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2.0",
    "httpx>=0.27.0",
    "google-adk>=2.11.0",
    "litellm>=1.104.0",
    "ddgs>=9.0.0",
    "jinja2>=3.1.4",
    "markdown>=3.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*"]

[tool.setuptools.package-data]
"api.services.templates" = ["*.html"]
